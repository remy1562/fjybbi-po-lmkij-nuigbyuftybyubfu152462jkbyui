<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f6f8">
<meta name="mobile-web-app-capable" content="yes">
<title>Cherche</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bg:#f2f6f8;--card:#ffffff;--ink:#13222c;--muted:#5d6f7a;--line:#d5e0e6;--accent:#0d5c6e;--accent-soft:#e1eef2;--err:#a63a2b}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:20px 0 6px}
h1{font:700 1.9rem/1.1 Georgia,"Iowan Old Style",serif;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 16px}
form{display:flex;gap:8px}
input[type=search],input[type=password],input[type=text]{flex:1;min-width:0;font:inherit;padding:14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
input:focus,button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button,.btn{font:inherit;font-weight:600;border:0;border-radius:12px;padding:14px 18px;background:var(--accent);color:#fff;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
button.alt,.btn.alt{background:var(--accent-soft);color:var(--accent)}
button.small{padding:9px 12px;font-size:.9rem}
button:disabled{opacity:.6}
#thread{margin-top:18px;display:flex;flex-direction:column;gap:16px}
.q{align-self:flex-end;max-width:85%;background:var(--accent);color:#fff;padding:10px 14px;border-radius:16px 16px 4px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.card img{display:block;width:100%;max-height:240px;object-fit:cover;background:var(--accent-soft)}
.body{padding:16px}
.card h2{font:700 1.4rem/1.2 Georgia,"Iowan Old Style",serif;margin:0 0 4px}
.lang{color:var(--muted);font-size:.85rem;margin:0 0 10px}
.extract{margin:0 0 14px;white-space:pre-line}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions>*{flex:1 1 110px}
.sum{margin-top:14px;padding:14px;border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:0 12px 12px 0}
.sum b{display:block;margin-bottom:4px;color:var(--accent)}
.sum.err{border-color:var(--err)}.sum.err b{color:var(--err)}
.msg{padding:14px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.msg.err{border-color:var(--err);color:var(--err)}
summary{cursor:pointer;font-weight:600}
details p{color:var(--muted);font-size:.9rem;margin:10px 0}
.row{display:flex;gap:8px}
[hidden]{display:none!important}
#mic{padding:14px 13px;display:flex;align-items:center}
#mic.rec{background:var(--err);color:#fff}
.chips{margin-top:16px;display:flex;flex-wrap:wrap;gap:8px}
.chips .lang{width:100%;margin:0}
.chip{background:var(--accent-soft);color:var(--accent);padding:8px 12px;font-size:.9rem;font-weight:500}
/* panneau historique */
#scrim{position:fixed;inset:0;background:rgba(19,34,44,.45);display:none;z-index:10}
#panel{position:fixed;top:0;bottom:0;left:0;width:min(86vw,340px);background:var(--card);z-index:11;transform:translateX(-100%);visibility:hidden;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);box-shadow:2px 0 16px rgba(0,0,0,.15)}
body.open #scrim{display:block}
body.open #panel{transform:none;visibility:visible}
#panel .top{display:flex;gap:8px;padding:14px;border-bottom:1px solid var(--line)}
#panel .top button{flex:1}
#list{list-style:none;margin:0;padding:6px 0;overflow:auto;flex:1}
#list li{display:flex;align-items:center;border-bottom:1px solid var(--line)}
#list li.cur{background:var(--accent-soft)}
#list .pick{flex:1;min-width:0;text-align:left;background:none;color:var(--ink);padding:14px;border-radius:0;font-weight:500}
#list .pick span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#list .pick small{color:var(--muted);font-weight:400}
#list .del{background:none;color:var(--err);padding:14px;border-radius:0}
.empty{color:var(--muted);padding:14px}
.hb{display:flex;gap:6px}
.tools{display:flex;gap:8px;margin-top:10px;align-items:center}
select{font:inherit;flex:1;min-width:0;padding:10px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
.more{white-space:pre-line;margin:0 0 14px;padding-top:12px;border-top:1px solid var(--line)}
.more:empty{display:none}
.tabs{display:flex;gap:6px;padding:10px 14px 0}
.tabs .tab{flex:1;padding:10px}
.tabs .tab.on{background:var(--accent);color:var(--bg)}
.srch{padding:10px 14px 0}.srch input{width:100%}
.foot{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line)}.foot button{flex:1}
#list .ren{background:none;color:var(--accent);padding:14px 8px;border-radius:0;font-size:.8rem}
#list .del{padding:14px 8px;font-size:.8rem}
:root{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1a20;--card:#17262e;--ink:#e6eef2;--muted:#93a6b0;--line:#2a3d47;--accent:#5cc0d4;--accent-soft:#1d3640;--err:#ff8a78}
:root[data-theme="dark"] button:not(.alt),:root[data-theme="dark"] .btn:not(.alt),:root[data-theme="dark"] .q{color:#06222b}
.gal{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:14px}
.gal:empty{display:none}
.gal img{display:block;width:100%;height:110px;object-fit:cover;border-radius:10px;background:var(--accent-soft)}
.today{margin:0 0 14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.today p{margin:8px 0}.today b{color:var(--accent)}
@media print{
  body{background:#fff;color:#000;max-width:none;padding:0}
  header,form,.tools,.sub,#today,#panel,#scrim,.actions,.chips,.gal{display:none!important}
  .card{break-inside:avoid;border:1px solid #999}
  .q{background:#eee;color:#000}
}
@media (prefers-reduced-motion:no-preference){
  #panel{transition:transform .2s ease,visibility .2s}
  .card{animation:in .25s ease-out}@keyframes in{from{opacity:0}to{opacity:1}}
}
</style>
</head>
<body>
<div id="scrim"></div>
<aside id="panel" aria-label="Conversations">
  <div class="top">
    <button id="newc" type="button">Nouvelle conversation</button>
    <button id="closep" class="alt" type="button">Fermer</button>
  </div>
  <div class="tabs"><button class="alt tab on" data-tab="c" type="button">Conversations</button><button class="alt tab" data-tab="f" type="button">Favoris</button></div>
  <div class="srch"><input id="lq" type="search" placeholder="Chercher dans mes conversations"></div>
  <ul id="list"></ul>
  <div class="foot"><button id="exp" class="alt small" type="button">Sauvegarder</button><button id="impb" class="alt small" type="button">Restaurer</button><input id="imp" type="file" accept="application/json,.json" hidden></div>
</aside>

<header>
  <h1>Cherche</h1>
  <div class="hb"><button id="theme" class="alt small" type="button">Sombre</button><button id="openp" class="alt small" type="button">Conversations</button></div>
</header>
<p class="sub">Tape une question, l'appli cherche sur Wikipédia.</p>
<details id="today" class="today" hidden><summary id="todayT">Ce jour-là</summary><div id="todayBody"></div></details>

<form id="f">
  <input id="q" type="search" placeholder="Une question, un lieu, un livre, la météo…" autocomplete="off" enterkeyhint="search" required>
  <button id="mic" class="alt" type="button" aria-label="Dicter la question" hidden><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-3.1A7 7 0 0 0 19 11z"/></svg></button>
  <button id="go" type="submit">Chercher</button>
</form>
<div class="tools">
  <select id="src" aria-label="Source de la recherche"><option value="auto">Automatique</option><option value="events">Année ou date (événements)</option><option value="wikipedia">Wikipédia</option><option value="wiktionary">Wiktionnaire (définitions)</option><option value="osm">Lieux (carte)</option><option value="weather">Météo</option><option value="sun">Soleil et air</option><option value="country">Pays</option><option value="calc">Calcul / conversion</option><option value="compare">Comparer deux sujets</option><option value="books">Livres</option><option value="wikiquote">Citations</option></select>
  <button id="rand" class="alt small" type="button">Article au hasard</button>
</div>

<div class="tools">
  <button id="xtxt" class="alt small" type="button">Exporter en texte</button>
  <button id="xpdf" class="alt small" type="button">Exporter en PDF</button>
</div>
<div id="thread" aria-live="polite"></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const store = {
  get(k){ try { return localStorage.getItem(k) || ''; } catch(e){ return ''; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
};

/* ---------- Conversations ---------- */
let convs = [];
try { convs = JSON.parse(store.get('convs') || '[]'); } catch(e){ convs = []; }
let cur = null;

const persist = () => store.set('convs', JSON.stringify(convs));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);

function newConv(){
  cur = { id: uid(), title: 'Nouvelle conversation', date: Date.now(), items: [] };
  convs.unshift(cur);
  persist(); renderThread(); renderList();
}
function openConv(id){
  const c = convs.find(x => x.id === id);
  if(!c) return;
  cur = c; renderThread(); renderList(); closePanel();
}
function delConv(id){
  const c = convs.find(x => x.id === id);
  if(!c || !confirm('Supprimer cette conversation ?')) return;
  convs = convs.filter(x => x.id !== id);
  persist();
  if(cur && cur.id === id){
    cur = convs[0] || null;
    if(!cur) { newConv(); return; }
  }
  renderThread(); renderList();
}

let tab = 'c';
function langLabel(r){
  if(r.src === 'osm') return 'OpenStreetMap';
  if(r.src === 'country') return 'Fiche pays';
  if(r.src === 'sun') return 'Open-Meteo (soleil et air)';
  if(r.src === 'calc') return 'Calcul (fait sur ton téléphone)';
  if(r.src === 'compare') return 'Wikipédia · comparaison';
  if(r.src === 'weather') return 'Open-Meteo';
  if(r.src === 'books') return 'Open Library';
  if(r.src === 'events') return r.lang === 'fr' ? 'Wikipédia · événements' : 'Wikipédia · événements (en anglais, rien en français)';
  const n = { wikipedia:'Wikipédia', wiktionary:'Wiktionnaire', wikiquote:'Wikiquote' }[r.src || 'wikipedia'] || 'Wikipédia';
  return r.lang === 'fr' ? `${n} en français` : `${n} en anglais (rien en français)`;
}
function linkLabel(r){
  return { osm:'Voir la carte', books:'Fiche du livre', weather:'Détails météo', wikiquote:'Lire la page', wiktionary:'Lire la page', events:'Lire la page', country:'Voir sur Wikipédia', sun:'Détails Open-Meteo', compare:'Lire le premier article' }[r.src] || "Lire l'article";
}
function renderList(){
  const ul = $('list');
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  $('lq').placeholder = tab === 'f' ? 'Chercher dans mes favoris' : 'Chercher dans mes conversations';
  const k = $('lq').value.trim().toLowerCase();
  if(tab === 'f'){
    const rows = favs.map((f,i) => ({ f, i }))
      .filter(({f}) => !k || (f.title + ' ' + (f.note || '') + ' ' + (f.folder || '')).toLowerCase().includes(k))
      .sort((a,b) => (a.f.folder || '\uffff').localeCompare(b.f.folder || '\uffff'));
    ul.innerHTML = rows.length ? rows.map(({f,i}) => `<li><button class="pick" data-fav="${i}" type="button"><span>${esc(f.title)}</span><small>${esc((f.folder ? f.folder + ' · ' : '') + (f.note || langLabel(f)))}</small></button><button class="ren" data-favnote="${i}" type="button" aria-label="Note et dossier de ${esc(f.title)}">Note</button><button class="del" data-favdel="${i}" type="button">Retirer</button></li>`).join('') : `<li class="empty">${k ? 'Aucun résultat.' : "Aucun favori pour l'instant."}</li>`;
    return;
  }
  const list = k ? convs.filter(c => (c.title + ' ' + c.items.map(it => it.q + ' ' + (it.res ? it.res.title + ' ' + it.res.extract : '')).join(' ')).toLowerCase().includes(k)) : convs;
  if(!list.length){ ul.innerHTML = `<li class="empty">${k ? 'Aucun résultat.' : 'Aucune conversation.'}</li>`; return; }
  ul.innerHTML = list.map(c => {
    const d = new Date(c.date).toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
    return `<li class="${cur && cur.id===c.id ? 'cur':''}">
      <button class="pick" data-id="${c.id}" type="button"><span>${esc(c.title)}</span><small>${d} · ${c.items.length} recherche${c.items.length>1?'s':''}</small></button>
      <button class="ren" data-ren="${c.id}" type="button" aria-label="Renommer ${esc(c.title)}">Renommer</button>
      <button class="del" data-del="${c.id}" type="button" aria-label="Supprimer ${esc(c.title)}">Supprimer</button>
    </li>`;
  }).join('');
}
$('list').addEventListener('click', e => {
  const g = a => e.target.closest('[' + a + ']');
  let x;
  if((x = g('data-del'))) delConv(x.dataset.del);
  else if((x = g('data-ren'))) renConv(x.dataset.ren);
  else if((x = g('data-id'))) openConv(x.dataset.id);
  else if((x = g('data-favnote'))) editFav(+x.dataset.favnote);
  else if((x = g('data-favdel'))){ favs.splice(+x.dataset.favdel, 1); saveFavs(); renderList(); }
  else if((x = g('data-fav'))) openFav(+x.dataset.fav);
});

function openPanel(){ document.body.classList.add('open'); }
function closePanel(){ document.body.classList.remove('open'); }
$('openp').onclick = openPanel;
$('closep').onclick = closePanel;
$('scrim').onclick = closePanel;
$('newc').onclick = () => { newConv(); closePanel(); $('q').focus(); };

/* ---------- Affichage ---------- */
function cardHTML(it, idx){
  if(it.error) return `<div class="msg err">${esc(it.error)}</div>`;
  if(it.notfound) return '<div class="msg">Aucun résultat. Essaie avec d\'autres mots.</div>';
  const r = it.res;
  return `<article class="card">
    ${r.img ? `<img src="${esc(r.img)}" alt="${esc(r.title)}">` : ''}
    <div class="body">
      <h2>${esc(r.title)}</h2>
      <p class="lang">${esc(langLabel(r))}</p>
      <p class="extract">${esc(r.extract)}</p>
      <div class="more" id="more-${idx}">${it.showMore ? esc(it.more) : ''}</div>
      <div class="actions">
        <button class="sumbtn" data-i="${idx}" type="button">Résumer</button>
        ${'speechSynthesis' in window ? `<button class="alt listenbtn" data-i="${idx}" type="button">Écouter</button>` : ''}
        ${(r.src || 'wikipedia') === 'wikipedia' ? `<button class="alt morebtn" data-i="${idx}" type="button">${it.showMore ? 'Réduire' : 'Lire la suite'}</button><button class="alt photobtn" data-i="${idx}" type="button">${it.showGal ? 'Masquer les photos' : 'Photos'}</button>` : ''}
        ${r.url ? `<button class="alt favbtn" data-i="${idx}" type="button">${isFav(r.url) ? 'Retirer des favoris' : 'Favori'}</button>` : ''}
        <button class="alt sharebtn" data-i="${idx}" type="button">Partager</button>
        ${r.url ? `<a class="btn alt" href="${esc(r.url)}" target="_blank" rel="noopener">${esc(linkLabel(r))}</a>` : ''}
      </div>
      <div class="sumout" id="sum-${idx}" aria-live="polite">${it.summary ? sumHTML(it) : ''}</div>
      <div class="gal" id="gal-${idx}">${it.showGal ? galHTML(it.gal) : ''}</div>
      ${chipsHTML(r)}
    </div>
  </article>`;
}
function renderThread(){
  const t = $('thread');
  if(!cur){ t.innerHTML=''; return; }
  t.innerHTML = cur.items.map((it,i) => `<div class="q">${esc(it.q)}</div>${cardHTML(it,i)}`).join('');
}
$('thread').addEventListener('click', e => {
  const b = e.target.closest('button');
  if(!b) return;
  if(b.classList.contains('sumbtn')) summarize(+b.dataset.i, b);
  else if(b.classList.contains('listenbtn')) listen(+b.dataset.i, b);
  else if(b.classList.contains('sharebtn')) share(+b.dataset.i, b);
  else if(b.classList.contains('morebtn')) more(+b.dataset.i, b);
  else if(b.classList.contains('photobtn')) photos(+b.dataset.i, b);
  else if(b.classList.contains('favbtn')) toggleFav(+b.dataset.i, b);
  else if(b.classList.contains('chip')){ $('q').value = b.dataset.t; doSearch(b.dataset.t, b.dataset.s); window.scrollTo({top:0,behavior:'smooth'}); }
});

/* ---------- Wikipédia ---------- */
function clean(q){
  const c = q.trim()
    .replace(/[?!.]+$/,'')
    .replace(/^(qui est|qui était|qui sont|qu['’]est[- ]ce que|qu['’]est[- ]ce qu['’]|c['’]est quoi|c['’]est qui|what is|who is)\s+/i,'')
    .replace(/^(un |une |le |la |les |l['’]|d['’]|du |de la |des )/i,'')
    .trim();
  return c || q.trim();
}
function wikiURL(lang, src, params){
  return `https://${lang}.${src}.org/w/api.php?action=query&${params}&format=json&origin=*`;
}
function toRes(pages, lang, src){
  pages = pages.slice().sort((a,b) => (a.index||0) - (b.index||0));
  const p = pages[0];
  if(!p || !p.extract) return null;
  return { lang, src, title:p.title, extract:p.extract.trim(), img:(p.thumbnail && p.thumbnail.source) || '', url:p.fullurl,
    others: pages.slice(1,5).map(o => ({ title:o.title, url:o.fullurl })) };
}
async function wiki(lang, q, src = 'wikipedia'){
  const dict = src !== 'wikipedia';
  const u = wikiURL(lang, src, `generator=search&gsrsearch=${encodeURIComponent(q)}&gsrlimit=${dict ? 1 : 5}&prop=extracts|pageimages|info&explaintext=1&${dict ? 'exlimit=1' : 'exintro=1&exsentences=5'}&piprop=thumbnail&pithumbsize=700&inprop=url`);
  const r = await fetch(u);
  if(!r.ok) throw new Error('wiki');
  const j = await r.json();
  const res = toRes(j.query ? Object.values(j.query.pages) : [], lang, src);
  if(res && dict) res.extract = cutText(res.extract, src === 'wikiquote' ? 1800 : 1200);
  return res;
}
async function randomWiki(){
  for(let k = 0; k < 3; k++){
    const u = wikiURL('fr', 'wikipedia', 'generator=random&grnnamespace=0&grnlimit=1&prop=extracts|pageimages|info&explaintext=1&exintro=1&exsentences=5&piprop=thumbnail&pithumbsize=700&inprop=url');
    const r = await fetch(u);
    if(!r.ok) throw new Error('wiki');
    const j = await r.json();
    const res = toRes(j.query ? Object.values(j.query.pages) : [], 'fr', 'wikipedia');
    if(res) return res;
  }
  return null;
}

$('f').addEventListener('submit', e => { e.preventDefault(); doSearch($('q').value.trim()); });

async function doSearch(raw, force){
  if(!raw) return;
  if(!cur) newConv();
  $('go').disabled = true;
  let item = { q: raw };
  try {
    const src = force || pickSource(raw);
    let res = await run(src, raw, !!force);
    if(res) item.res = res; else item.notfound = true;
  } catch(err){
    item.error = navigator.onLine ? 'Impossible de joindre le site de recherche. Réessaie dans un instant.' : 'Tu es hors ligne : la recherche est impossible, mais tu peux relire tes conversations.';
  }
  if(!cur.items.length) cur.title = raw.length > 40 ? raw.slice(0,40) + '…' : raw;
  cur.items.push(item);
  persist(); renderThread(); renderList();
  $('q').value = '';
  $('go').disabled = false;
  const cards = document.querySelectorAll('#thread .card, #thread .msg');
  const last = cards[cards.length-1];
  if(last) last.scrollIntoView({behavior:'smooth', block:'start'});
}

/* ---------- Résumé simple (sans IA, rien à télécharger) ---------- */
function sumHTML(it){
  return `<div class="sum"><b>Résumé</b>${esc(it.summary)}</div>`;
}
function firstSentences(t, n){
  const parts = t.replace(/\s+/g,' ').match(/[^.!?]+[.!?]+(\s|$)/g);
  return parts ? parts.slice(0,n).join('').trim() : t.slice(0,300);
}
function summarize(i, btn){
  const it = cur.items[i];
  it.summary = firstSentences(it.res.extract, 2);
  persist();
  $('sum-'+i).innerHTML = sumHTML(it);
}

/* ---------- Suggestions, lecture, partage, voix, hors ligne ---------- */
function chipsHTML(r){
  if(!r.others || !r.others.length) return '';
  return `<div class="chips"><p class="lang">D'autres articles proches :</p>${r.others.map(o => `<button class="chip" data-s="${esc(o.s || r.src || 'wikipedia')}" data-t="${esc(o.q || o.title)}" type="button">${esc(o.title)}</button>`).join('')}</div>`;
}
function listen(i, btn){
  const sy = window.speechSynthesis;
  if(!sy) return;
  if(sy.speaking){ sy.cancel(); document.querySelectorAll('.listenbtn').forEach(b => b.textContent = 'Écouter'); return; }
  const it = cur.items[i];
  const u = new SpeechSynthesisUtterance(it.summary || it.res.extract);
  u.lang = it.res.lang === 'fr' ? 'fr-FR' : 'en-US';
  u.onend = u.onerror = () => { btn.textContent = 'Écouter'; };
  btn.textContent = 'Arrêter';
  sy.speak(u);
}
async function share(i, btn){
  const r = cur.items[i].res, it = cur.items[i];

/* ---------- Autres sources : lieux, météo, livres, citations, photos ---------- */
async function getJSON(u){
  const r = await fetch(u);
  if(!r.ok) throw new Error('http');
  return r.json();
}
function pickSource(raw){
  const v = $('src').value;
  if(v !== 'auto') return v;
  const t = raw.toLowerCase().trim().replace(/’/g, "'");
  const dd = parseDate(raw);
  if(dd && (/^(?:en |l'année |année )?\d{3,4}$/.test(t)
    || (dd.month && /^(?:le )?(?:\d{1,2}(?:er)?\s+[a-zéûè]+\s+|\d{1,2}[\/.-]\d{1,2}[\/.-]|[a-zéûè]+\s+)\d{3,4}$/.test(t))
    || /(événement|evenement|s'est[- ]il passé|s'est passé)/.test(t))) return 'events';
  if(calc(raw)) return 'calc';
  if(compareAuto(raw)) return 'compare';
  if(/\b(qualité de l'air|qualite de l'air|pollution|lever du soleil|coucher du soleil)\b/.test(t)) return 'sun';
  if(/\b(capitale|drapeau|habitants|fiche pays)\b/.test(t)) return 'country';
  if(/\b(météo|meteo|température|temperature|quel temps)\b/.test(t)) return 'weather';
  if(/\b(où se trouve|ou se trouve|où est|ou est|carte de|carte du|adresse de|adresse du|plan de|localiser|itinéraire)\b/.test(t)) return 'osm';
  if(/\b(livre|livres|roman|romans|auteur|isbn)\b/.test(t)) return 'books';
  if(/\b(citation|citations|phrase célèbre|phrases célèbres)\b/.test(t)) return 'wikiquote';
  if(/\b(définition|definition|signifie|veut dire|signification)\b/.test(t)) return 'wiktionary';
  return 'wikipedia';
}
const strip = (t, w) => t.replace(new RegExp('(^|\\s)(?:' + w + ')(?=\\s|$)', 'gi'), ' ').replace(/\s+/g, ' ').trim();
function queryFor(src, raw, exact){
  let t = raw.trim().replace(/[?!.]+$/, '').replace(/’/g, "'");
  if(exact) return t;
  if(src === 'weather'){
    t = strip(t, "quelle|quel|est|la|le|temps|fait-il|fait|il|météo|meteo|température|temperature|actuelle|aujourd'hui|demain|maintenant");
    t = t.replace(/^(à|a|de|du|en|pour|sur|au|aux|dans)\s+/i, '');
  }else if(src === 'osm'){
    t = t.replace(/^(où se trouve|ou se trouve|où est|ou est|carte de|carte du|adresse de|adresse du|plan de|localiser|localisation de|itinéraire pour aller à)\s+/i, '');
  }else if(src === 'books'){
    t = strip(t, 'livre|livres|roman|romans|auteur|isbn').replace(/^(de\s+|du\s+|sur\s+|le\s+|la\s+|les\s+|un\s+|une\s+|des\s+|d')/i, '');
  }else if(src === 'wikiquote'){
    t = strip(t, 'citation|citations|phrase célèbre|phrases célèbres').replace(/^(de\s+|du\s+|sur\s+|par\s+|d')/i, '');
  }else if(src === 'wiktionary'){
    t = t.replace(/^(définition|definition|signification)( de| du| d')?\s*/i, '')
         .replace(/^(que |qu'est-ce que )?(signifie|veut dire)\s+(le mot |l'expression )?/i, '')
         .replace(/\s+(signifie|veut dire)$/i, '');
  }else if(src === 'sun'){
    t = t.replace(/(qualité|qualite) de l'air|lever du soleil|coucher du soleil/gi, ' ');
    t = strip(t, "quelle|quel|est|la|le|air|pollution|soleil|heure|heures|aujourd'hui|demain");
    t = t.replace(/^(à|a|de|du|en|pour|sur|au|aux|dans)\s+/i, '');
  }else if(src === 'country'){
    t = t.replace(/combien d'habitants|fiche pays/gi, ' ');
    t = strip(t, "quelle|quel|est|la|capitale|drapeau|habitants|population|pays|combien|y|a|il|en|au|aux|dans");
    t = t.replace(/^(de la\s+|du\s+|de l'|d'|des\s+|de\s+|la\s+|le\s+|les\s+|l')/i, '');
  }else t = clean(t);
  return t || raw.trim();
}
async function run(src, raw, exact){
  const q = queryFor(src, raw, exact);
  if(src === 'events') return events(raw);
  if(src === 'calc') return calc(raw);
  if(src === 'compare') return compare(raw);
  if(src === 'sun') return sunAir(q);
  if(src === 'country') return country(q);
  if(src === 'weather') return weather(q);
  if(src === 'osm') return places(q);
  if(src === 'books') return books(q);
  let res = await wiki('fr', q, src);
  if(!res) res = await wiki('en', q, src);
  return res;
}
async function places(q){
  const j = await getJSON(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=jsonv2&limit=5&accept-language=fr`);
  if(!j.length) return null;
  const a = j.map(o => ({ title:o.name || o.display_name.split(',')[0], full:o.display_name, lat:o.lat, lon:o.lon, type:o.type }));
  const f = a[0];
  return { lang:'fr', src:'osm', title:f.title,
    extract:`${f.full}\nType : ${f.type}.\nCoordonnées : ${(+f.lat).toFixed(4)}, ${(+f.lon).toFixed(4)}.`,
    img:'', url:`https://www.openstreetmap.org/?mlat=${f.lat}&mlon=${f.lon}#map=14/${f.lat}/${f.lon}`,
    others:a.slice(1).map(o => ({ title:o.title + ' · ' + o.full.split(',').slice(1,3).join(',').trim(), q:o.full })) };
}
function wmo(c){
  if(c === 0) return 'ciel dégagé';
  if(c === 1) return 'plutôt dégagé';
  if(c === 2) return 'partiellement nuageux';
  if(c === 3) return 'couvert';
  if(c === 45 || c === 48) return 'brouillard';
  if(c >= 51 && c <= 57) return 'bruine';
  if(c >= 61 && c <= 67) return 'pluie';
  if(c >= 71 && c <= 77) return 'neige';
  if(c >= 80 && c <= 82) return 'averses';
  if(c === 85 || c === 86) return 'averses de neige';
  if(c >= 95) return 'orage';
  return 'temps variable';
}
async function weather(q){
  const g = await getJSON(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=1&language=fr`);
  const p = g.results && g.results[0];
  if(!p) return null;
  const j = await getJSON(`https://api.open-meteo.com/v1/forecast?latitude=${p.latitude}&longitude=${p.longitude}&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=4`);
  const c = j.current, d = j.daily;
  const days = d.time.map((t,i) => {
    const dt = new Date(t + 'T12:00:00').toLocaleDateString('fr-FR', { weekday:'long', day:'numeric', month:'long' });
    const pr = d.precipitation_probability_max[i];
    return `${dt} : ${Math.round(d.temperature_2m_min[i])} à ${Math.round(d.temperature_2m_max[i])} °C, ${wmo(d.weather_code[i])}${pr != null ? ', pluie ' + pr + ' %' : ''}`;
  });
  const place = [p.name, p.admin1, p.country].filter(Boolean).join(', ');
  return { lang:'fr', src:'weather', title:'Météo à ' + p.name,
    extract:`${place}\nMaintenant : ${Math.round(c.temperature_2m)} °C (ressenti ${Math.round(c.apparent_temperature)} °C), ${wmo(c.weather_code)}, vent ${Math.round(c.wind_speed_10m)} km/h.\n\nProchains jours :\n${days.join('\n')}`,
    img:'', url:'https://open-meteo.com/', others:[] };
}
async function books(q){
  const j = await getJSON(`https://openlibrary.org/search.json?q=${encodeURIComponent(q)}&limit=5&fields=key,title,author_name,first_publish_year,cover_i,subject`);
  const d = j.docs || [];
  if(!d.length) return null;
  const f = d[0];
  const txt = (f.author_name ? 'Par ' + f.author_name.slice(0,3).join(', ') + '.' : '')
    + (f.first_publish_year ? ' Première publication : ' + f.first_publish_year + '.' : '')
    + (f.subject ? '\nThèmes : ' + f.subject.slice(0,6).join(', ') + '.' : '');
  return { lang:'fr', src:'books', title:f.title, extract:txt.trim() || 'Aucune description disponible.',
    img:f.cover_i ? `https://covers.openlibrary.org/b/id/${f.cover_i}-M.jpg` : '', url:'https://openlibrary.org' + f.key,
    others:d.slice(1).map(b => ({ title:b.title + (b.author_name ? ' · ' + b.author_name[0] : ''), q:b.title + (b.author_name ? ' ' + b.author_name[0] : '') })) };
}
function galHTML(g){

/* ---------- Événements d'une année ou d'une date ---------- */
const MOIS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const MONTHS_EN = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function cutText(t, n){
  if(t.length <= n) return t;
  const c = t.slice(0, n);
  const k = Math.max(c.lastIndexOf('\n'), c.lastIndexOf('. '));
  return (k > n * 0.5 ? c.slice(0, k + 1) : c) + '…';
}
function parseDate(raw){
  const t = raw.toLowerCase().replace(/’/g, "'");
  let m = t.match(/\b(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{3,4})\b/);
  if(m) return { day:+m[1], month:+m[2], year:+m[3] };
  const names = MOIS.map((x,i) => [x, i+1]).concat([['fevrier',2],['aout',8],['decembre',12]]);
  for(const [name, num] of names){
    m = t.match(new RegExp('(?:\\b(\\d{1,2})(?:er)?\\s+)?' + name + '\\s+(\\d{3,4})\\b'));
    if(m) return { day:m[1] ? +m[1] : null, month:num, year:+m[2] };
  }
  m = t.match(/\b(\d{3,4})\b/);
  return m ? { year:+m[1] } : null;
}
function parseYear(text, lang){
  const arr = lang === 'fr' ? MOIS : MONTHS_EN, mo = arr.join('|');
  const re = lang === 'fr'
    ? new RegExp('^(?:(\\d{1,2})(?:er)?\\s+)?(' + mo + ')\\b\\s*[:–—-]\\s*(.{25,})$', 'i')
    : new RegExp('^(' + mo + ')\\s+(\\d{1,2})\\s*[:–—-]\\s*(.{25,})$', 'i');
  const idx = x => arr.findIndex(a => a.toLowerCase() === x.toLowerCase());
  const out = [];
  for(const raw of text.split('\n')){
    const m = raw.trim().match(re);
    if(!m) continue;
    out.push(lang === 'fr' ? { mo:idx(m[2]), day:m[1] ? +m[1] : null, text:m[3] } : { mo:idx(m[1]), day:+m[2], text:m[3] });
  }
  return out;
}
function chooseEvents(items, d){
  if(d && d.month){
    const mo = items.filter(x => x.mo === d.month - 1);
    const dd = d.day ? mo.filter(x => x.day === d.day) : [];
    return (dd.length ? dd : mo).slice(0, 8);
  }
  const by = {};
  items.forEach(x => (by[x.mo] = by[x.mo] || []).push(x));
  const out = [];
  Object.keys(by).sort((a,b) => a - b).forEach(k => out.push(...by[k].slice(0, 2)));
  return out.slice(0, 14);
}
function genericLines(text){
  const lines = text.split('\n').map(l => l.trim());
  const i = lines.findIndex(l => /^(événements|en bref|events)$/i.test(l));
  return lines.slice(i + 1).filter(l => l.length > 50 && l.length < 320).slice(0, 10);
}
async function events(raw){
  const d = parseDate(raw);
  if(!d || !d.year) return null;
  const y = d.year, pad = n => String(n).padStart(2, '0');
  const jour = d.day ? (d.day === 1 ? '1er' : d.day) : '';
  if(d.day && d.month){
    try{
      const j = await getJSON(`https://fr.wikipedia.org/api/rest_v1/feed/onthisday/events/${pad(d.month)}/${pad(d.day)}`);
      const ev = (j.events || []).filter(e => e.year === y);
      if(ev.length) return { lang:'fr', src:'events', title:`${jour} ${MOIS[d.month-1]} ${y}`, extract:ev.slice(0, 8).map(e => e.text).join('\n\n'), img:'', url:`https://fr.wikipedia.org/wiki/${jour}_${MOIS[d.month-1]}`, others:[] };
    }catch(e){ if(!navigator.onLine) throw e; }
  }
  for(const lang of ['fr', 'en']){
    try{
      const j = await getJSON(wikiURL(lang, 'wikipedia', `prop=extracts|info&explaintext=1&exsectionformat=plain&redirects=1&inprop=url&titles=${y}`));
      const p = Object.values((j.query && j.query.pages) || {})[0];
      if(!p || !p.extract) continue;
      const names = lang === 'fr' ? MOIS : MONTHS_EN;
      const title = d.month ? `${names[d.month-1]} ${y}` : (lang === 'fr' ? `Événements de ${y}` : `Événements de ${y}`);
      const pick = chooseEvents(parseYear(p.extract, lang), d);
      let lines = pick.map(x => lang === 'fr' ? `${x.day ? (x.day === 1 ? '1er' : x.day) + ' ' : ''}${names[x.mo]} : ${x.text}` : `${names[x.mo]}${x.day ? ' ' + x.day : ''} : ${x.text}`);
      if(lines.length < 2 && lang === 'fr') lines = genericLines(p.extract);
      if(lines.length < 2) continue;
      return { lang, src:'events', title, extract:lines.join('\n\n'), img:'', url:p.fullurl, others:[] };
    }catch(e){ if(!navigator.onLine) throw e; }
  }
  return null;
}

const UNITS = {
  m:['L',1], mètre:['L',1], metre:['L',1], mètres:['L',1], metres:['L',1], km:['L',1000], kilomètre:['L',1000], kilomètres:['L',1000], cm:['L',.01], mm:['L',.001],
  mi:['L',1609.344], mile:['L',1609.344], miles:['L',1609.344], ft:['L',.3048], pied:['L',.3048], pieds:['L',.3048], in:['L',.0254], pouce:['L',.0254], pouces:['L',.0254], yd:['L',.9144],
  kg:['M',1], g:['M',.001], lb:['M',.45359237], lbs:['M',.45359237], livre:['M',.45359237], livres:['M',.45359237], oz:['M',.028349523], t:['M',1000], tonne:['M',1000], tonnes:['M',1000],
  l:['V',1], litre:['V',1], litres:['V',1], ml:['V',.001], cl:['V',.01], gal:['V',3.785411784], gallon:['V',3.785411784], gallons:['V',3.785411784],
  'km/h':['S',1/3.6], kmh:['S',1/3.6], mph:['S',.44704], 'm/s':['S',1], nœuds:['S',.514444], noeuds:['S',.514444], kn:['S',.514444],
  c:['T','c'], '°c':['T','c'], celsius:['T','c'], f:['T','f'], '°f':['T','f'], fahrenheit:['T','f'], k:['T','k'], kelvin:['T','k']
};
const nf = new Intl.NumberFormat('fr-FR', { maximumFractionDigits: 4 });
const num = x => parseFloat(String(x).replace(/\s/g, '').replace(',', '.'));
function calcRes(title, extract){ return { lang:'fr', src:'calc', title, extract, img:'', url:'', others:[] }; }
function dayDiff(a, b){
  const A = Date.UTC(a.year, a.month - 1, a.day), B = Date.UTC(b.year, b.month - 1, b.day);
  return Math.round((B - A) / 86400000);
}
function calc(raw){
  const t = raw.trim().toLowerCase().replace(/’/g, "'").replace(/[?!.]+$/, '');
  let m = t.match(/^([-+]?\d[\d\s]*(?:[.,]\d+)?)\s*([°a-zœéè\/]+)\s+(?:en|vers|to|→|->|=)\s+([°a-zœéè\/]+)$/);
  if(m && UNITS[m[2]] && UNITS[m[3]] && UNITS[m[2]][0] === UNITS[m[3]][0]){
    const v = num(m[1]), a = UNITS[m[2]], b = UNITS[m[3]];
    let out;
    if(a[0] === 'T'){
      const k = a[1] === 'c' ? v + 273.15 : a[1] === 'f' ? (v - 32) * 5 / 9 + 273.15 : v;
      out = b[1] === 'c' ? k - 273.15 : b[1] === 'f' ? (k - 273.15) * 9 / 5 + 32 : k;
    }else out = v * a[1] / b[1];
    return calcRes('Conversion', `${nf.format(v)} ${m[2]} = ${nf.format(out)} ${m[3]}`);
  }
  m = t.match(/^([\d\s.,]+)\s*%\s*(?:de|d')\s*([\d\s.,]+)$/);
  if(m){ const a = num(m[1]), b = num(m[2]); return calcRes('Pourcentage', `${nf.format(a)} % de ${nf.format(b)} = ${nf.format(a * b / 100)}`); }
  m = t.match(/entre\s+(.+?)\s+et\s+(.+)$/);
  if(m && /jours?/.test(t)){
    const a = parseDate(m[1]), b = parseDate(m[2]);
    if(a && b && a.day && a.month && b.day && b.month){
      const n = dayDiff(a, b), abs = Math.abs(n);
      return calcRes('Jours entre deux dates', `${nf.format(abs)} jour${abs > 1 ? 's' : ''} (environ ${nf.format(Math.round(abs / 7 * 10) / 10)} semaines, ou ${nf.format(Math.round(abs / 365.25 * 100) / 100)} an)\n${n < 0 ? 'La deuxième date est antérieure à la première.' : ''}`.trim());
    }
  }
  if(/(quel jour|jour de la semaine)/.test(t)){
    const d = parseDate(t);
    if(d && d.day && d.month && d.year){
      const dt = new Date(Date.UTC(d.year, d.month - 1, d.day));
      return calcRes('Jour de la semaine', dt.toLocaleDateString('fr-FR', { weekday:'long', day:'numeric', month:'long', year:'numeric', timeZone:'UTC' }));
    }
  }
  if(/^[\d\s+\-*\/().,^x×÷]+$/.test(t) && /\d/.test(t) && /[+\-*\/^x×÷]/.test(t.replace(/^\s*-/, ''))){
    try{
      const e = t.replace(/[x×]/g, '*').replace(/÷/g, '/').replace(/\^/g, '**').replace(/(\d),(\d)/g, '$1.$2');
      const v = Function('"use strict";return (' + e + ')')();
      if(typeof v === 'number' && isFinite(v)) return calcRes('Calcul', `${raw.trim()} = ${nf.format(v)}`);
    }catch(err){}
  }
  return null;
}
function splitCompare(raw){
  const t = raw.trim().replace(/[?!.]+$/, '');
  const m = t.match(/^(?:comparer|compare|comparaison(?: entre)?|différence entre|difference entre)\s+(.+?)\s+(?:et|avec|à|vs\.?|contre)\s+(.+)$/i)
    || t.match(/^(.+?)\s+(?:contre|vs\.?|versus)\s+(.+)$/i);
  return m ? [clean(m[1]), clean(m[2])] : null;
}
function compareAuto(raw){
  const t = raw.trim();
  if(/^(comparer|compare|comparaison|différence entre|difference entre)\s/i.test(t) || /\s(vs\.?|versus)\s/i.test(t)) return splitCompare(raw);
  const m = t.match(/^(.+?)\s+contre\s+(.+)$/i);
  return m && /^[A-ZÀ-ÝÉ0-9]/.test(m[1]) && /^[A-ZÀ-ÝÉ0-9]/.test(m[2]) && m[1].split(/\s+/).length <= 3 && m[2].split(/\s+/).length <= 3 ? splitCompare(raw) : null;
}
async function compare(raw){
  const p = splitCompare(raw);
  if(!p) return null;
  const rs = [];
  for(const q of p){
    let r = await wiki('fr', q, 'wikipedia');
    if(!r) r = await wiki('en', q, 'wikipedia');
    rs.push(r);
  }
  if(!rs[0] && !rs[1]) return null;
  const a = rs[0] || rs[1];
  return { lang:'fr', src:'compare', title:rs.map((r,i) => r ? r.title : p[i]).join(' · '),
    extract:rs.map((r,i) => r ? `${r.title}\n${cutText(r.extract, 520)}` : `${p[i]}\nAucun résultat.`).join('\n\n———\n\n'),
    img:a.img, url:a.url, others:rs.filter(Boolean).map(r => ({ title:'Ouvrir : ' + r.title, q:r.title, s:'wikipedia' })) };
}
const flat = x => String(x).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
let COUNTRIES = null;
async function country(q){
  let c = null;
  try{
    const r = await fetch(`https://restcountries.com/v3.1/translation/${encodeURIComponent(q)}?fields=name,translations,capital,population,area,languages,currencies,flags,cca2,region`);
    if(r.ok){ const j = await r.json(); if(Array.isArray(j) && j.length) c = j[0]; }
  }catch(e){}
  if(!c){
    try{
      if(!COUNTRIES) COUNTRIES = await getJSON('https://raw.githubusercontent.com/mledoze/countries/master/countries.json');
      const k = flat(q);
      const hit = COUNTRIES.find(x => [x.name.common, x.name.official, (x.translations.fra || {}).common, (x.translations.fra || {}).official].some(n => n && flat(n) === k))
        || COUNTRIES.find(x => [(x.translations.fra || {}).common, x.name.common].some(n => n && flat(n).startsWith(k)) && k.length > 3);
      if(hit){
        let pop = null;
        try{ const w = await getJSON(`https://api.worldbank.org/v2/country/${hit.cca2}/indicator/SP.POP.TOTL?format=json&mrv=1`); pop = w[1] && w[1][0] && w[1][0].value; }catch(e){}
        c = { name:hit.name, translations:hit.translations, capital:hit.capital, population:pop, area:hit.area, languages:hit.languages, currencies:hit.currencies, cca2:hit.cca2, region:hit.region,
          flags:{ png:`https://flagcdn.com/w320/${hit.cca2.toLowerCase()}.png` } };
      }
    }catch(e){ if(!navigator.onLine) throw e; }
  }
  if(!c) return null;
  const nom = (c.translations && c.translations.fra && c.translations.fra.common) || c.name.common;
  const lines = [];
  if(c.capital && c.capital.length) lines.push('Capitale : ' + c.capital.join(', '));
  if(c.population) lines.push('Population : ' + c.population.toLocaleString('fr-FR') + ' habitants');
  if(c.area) lines.push('Superficie : ' + c.area.toLocaleString('fr-FR') + ' km²');
  if(c.languages) lines.push('Langues : ' + Object.values(c.languages).join(', '));
  if(c.currencies) lines.push('Monnaie : ' + Object.values(c.currencies).map(x => x.name + (x.symbol ? ' (' + x.symbol + ')' : '')).join(', '));
  if(c.region) lines.push('Région : ' + c.region);
  return { lang:'fr', src:'country', title:nom, extract:lines.join('\n'), img:(c.flags && (c.flags.png || c.flags.svg)) || '',
    url:'https://fr.wikipedia.org/wiki/' + encodeURIComponent(nom.replace(/ /g, '_')), others:[] };
}
async function sunAir(q){
  const g = await getJSON(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=1&language=fr`);
  const p = g.results && g.results[0];
  if(!p) return null;
  const [f, a] = await Promise.all([
    getJSON(`https://api.open-meteo.com/v1/forecast?latitude=${p.latitude}&longitude=${p.longitude}&daily=sunrise,sunset,daylight_duration&timezone=auto&forecast_days=1`),
    getJSON(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${p.latitude}&longitude=${p.longitude}&current=european_aqi,pm10,pm2_5&timezone=auto`).catch(() => null)
  ]);
  const hm = x => x.slice(11, 16), dur = f.daily.daylight_duration[0];
  const lines = [[p.name, p.admin1, p.country].filter(Boolean).join(', '),
    `Lever du soleil : ${hm(f.daily.sunrise[0])}`, `Coucher du soleil : ${hm(f.daily.sunset[0])}`,
    `Durée du jour : ${Math.floor(dur / 3600)} h ${String(Math.round((dur % 3600) / 60)).padStart(2, '0')}`];
  const c = a && a.current;
  if(c && c.european_aqi != null){
    const v = c.european_aqi;
    const lab = v <= 20 ? 'bonne' : v <= 40 ? 'correcte' : v <= 60 ? 'moyenne' : v <= 80 ? 'mauvaise' : v <= 100 ? 'très mauvaise' : 'extrêmement mauvaise';
    lines.push('', `Qualité de l'air : ${lab} (indice européen ${Math.round(v)})`, `Particules fines PM2,5 : ${c.pm2_5} µg/m³ · PM10 : ${c.pm10} µg/m³`);
  }else lines.push('', "Qualité de l'air : donnée indisponible pour ce lieu.");
  return { lang:'fr', src:'sun', title:'Soleil et air à ' + p.name, extract:lines.join('\n'), img:'', url:'https://open-meteo.com/', others:[] };
}
async function loadToday(){
  const d = new Date(), pad = n => String(n).padStart(2, '0');
  const key = 'today-' + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate());
  let ev = null;
  try{ ev = JSON.parse(store.get(key) || 'null'); }catch(e){ ev = null; }
  if(!ev){
    try{
      const j = await getJSON(`https://fr.wikipedia.org/api/rest_v1/feed/onthisday/events/${pad(d.getMonth() + 1)}/${pad(d.getDate())}`);
      ev = (j.events || []).map(e => ({ y:e.year, t:cutText(e.text, 200) })).sort((a,b) => a.y - b.y);
      try{ Object.keys(localStorage).forEach(k => { if(k.startsWith('today-') && k !== key) localStorage.removeItem(k); }); }catch(e){}
      store.set(key, JSON.stringify(ev));
    }catch(e){ return; }
  }
  if(!ev.length) return;
  const n = Math.min(5, ev.length), pick = [];
  for(let i = 0; i < n; i++) pick.push(ev[Math.floor(i * ev.length / n)]);
  $('todayT').textContent = 'Ce jour-là (' + d.toLocaleDateString('fr-FR', { day:'numeric', month:'long' }) + ')';
  $('todayBody').innerHTML = pick.map(e => `<p><b>${esc(e.y)}</b> — ${esc(e.t)}</p>`).join('');
  $('today').hidden = false;
}
function editFav(i){
  const f = favs[i];
  if(!f) return;
  const n = prompt('Note sur ce favori (vide pour effacer) :', f.note || '');
  if(n === null) return;
  const folders = [...new Set(favs.map(x => x.folder).filter(Boolean))];
  const d = prompt('Dossier' + (folders.length ? ' (existants : ' + folders.join(', ') + ')' : '') + ' — vide pour aucun :', f.folder || '');
  if(d === null) return;
  f.note = n.trim().slice(0, 200); f.folder = d.trim().slice(0, 30);
  saveFavs(); renderList();
}
function convText(c){
  const L = [c.title, new Date(c.date).toLocaleDateString('fr-FR'), ''];
  c.items.forEach(it => {
    L.push('Q : ' + it.q);
    if(it.res){ L.push(it.res.title, it.res.extract); if(it.summary) L.push('Résumé : ' + it.summary); if(it.res.url) L.push(it.res.url); }
    else L.push('(aucun résultat)');
    L.push('');
  });
  return L.join('\n');
}
$('xtxt').onclick = async () => {
  if(!cur || !cur.items.length){ alert('Rien à exporter pour le moment.'); return; }
  const t = convText(cur);
  try{
    if(navigator.share){ await navigator.share({ title:cur.title, text:t }); return; }
    await navigator.clipboard.writeText(t);
    alert('Conversation copiée : tu peux la coller où tu veux.');
  }catch(e){}
};
$('xpdf').onclick = () => {
  if(!cur || !cur.items.length){ alert('Rien à exporter pour le moment.'); return; }
  alert("Dans la fenêtre qui s'ouvre, choisis « Enregistrer au format PDF ».");
  window.print();
};
