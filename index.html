<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f6f8">
<meta name="mobile-web-app-capable" content="yes">
<title>Cherche</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bg:#f2f6f8;--card:#ffffff;--ink:#13222c;--muted:#5d6f7a;--line:#d5e0e6;--accent:#0d5c6e;--accent-soft:#e1eef2;--err:#a63a2b}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:20px 0 6px}
h1{font:700 1.9rem/1.1 Georgia,"Iowan Old Style",serif;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 16px}
form{display:flex;gap:8px}
input[type=search],input[type=password],input[type=text]{flex:1;min-width:0;font:inherit;padding:14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
input:focus,button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button,.btn{font:inherit;font-weight:600;border:0;border-radius:12px;padding:14px 18px;background:var(--accent);color:#fff;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
button.alt,.btn.alt{background:var(--accent-soft);color:var(--accent)}
button.small{padding:9px 12px;font-size:.9rem}
button:disabled{opacity:.6}
#thread{margin-top:18px;display:flex;flex-direction:column;gap:16px}
.q{align-self:flex-end;max-width:85%;background:var(--accent);color:#fff;padding:10px 14px;border-radius:16px 16px 4px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.card img{display:block;width:100%;max-height:240px;object-fit:cover;background:var(--accent-soft)}
.body{padding:16px}
.card h2{font:700 1.4rem/1.2 Georgia,"Iowan Old Style",serif;margin:0 0 4px}
.lang{color:var(--muted);font-size:.85rem;margin:0 0 10px}
.extract{margin:0 0 14px;white-space:pre-line}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions>*{flex:1 1 110px}
.sum{margin-top:14px;padding:14px;border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:0 12px 12px 0}
.sum b{display:block;margin-bottom:4px;color:var(--accent)}
.sum.err{border-color:var(--err)}.sum.err b{color:var(--err)}
.msg{padding:14px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.msg.err{border-color:var(--err);color:var(--err)}
summary{cursor:pointer;font-weight:600}
details p{color:var(--muted);font-size:.9rem;margin:10px 0}
.row{display:flex;gap:8px}
[hidden]{display:none!important}
#mic{padding:14px 13px;display:flex;align-items:center}
#mic.rec{background:var(--err);color:#fff}
.chips{margin-top:16px;display:flex;flex-wrap:wrap;gap:8px}
.chips .lang{width:100%;margin:0}
.chip{background:var(--accent-soft);color:var(--accent);padding:8px 12px;font-size:.9rem;font-weight:500}
/* panneau historique */
#scrim{position:fixed;inset:0;background:rgba(19,34,44,.45);display:none;z-index:10}
#panel{position:fixed;top:0;bottom:0;left:0;width:min(86vw,340px);background:var(--card);z-index:11;transform:translateX(-100%);visibility:hidden;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);box-shadow:2px 0 16px rgba(0,0,0,.15)}
body.open #scrim{display:block}
body.open #panel{transform:none;visibility:visible}
#panel .top{display:flex;gap:8px;padding:14px;border-bottom:1px solid var(--line)}
#panel .top button{flex:1}
#list{list-style:none;margin:0;padding:6px 0;overflow:auto;flex:1}
#list li{display:flex;align-items:center;border-bottom:1px solid var(--line)}
#list li.cur{background:var(--accent-soft)}
#list .pick{flex:1;min-width:0;text-align:left;background:none;color:var(--ink);padding:14px;border-radius:0;font-weight:500}
#list .pick span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#list .pick small{color:var(--muted);font-weight:400}
#list .del{background:none;color:var(--err);padding:14px;border-radius:0}
.empty{color:var(--muted);padding:14px}
.hb{display:flex;gap:6px}
.tools{display:flex;gap:8px;margin-top:10px;align-items:center}
select{font:inherit;flex:1;min-width:0;padding:10px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
.more{white-space:pre-line;margin:0 0 14px;padding-top:12px;border-top:1px solid var(--line)}
.more:empty{display:none}
.tabs{display:flex;gap:6px;padding:10px 14px 0}
.tabs .tab{flex:1;padding:10px}
.tabs .tab.on{background:var(--accent);color:var(--bg)}
.srch{padding:10px 14px 0}.srch input{width:100%}
.foot{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line)}.foot button{flex:1}
#list .ren{background:none;color:var(--accent);padding:14px 8px;border-radius:0;font-size:.8rem}
#list .del{padding:14px 8px;font-size:.8rem}
:root{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1a20;--card:#17262e;--ink:#e6eef2;--muted:#93a6b0;--line:#2a3d47;--accent:#5cc0d4;--accent-soft:#1d3640;--err:#ff8a78}
:root[data-theme="dark"] button:not(.alt),:root[data-theme="dark"] .btn:not(.alt),:root[data-theme="dark"] .q{color:#06222b}
@media (prefers-reduced-motion:no-preference){
  #panel{transition:transform .2s ease,visibility .2s}
  .card{animation:in .25s ease-out}@keyframes in{from{opacity:0}to{opacity:1}}
}
</style>
</head>
<body>
<div id="scrim"></div>
<aside id="panel" aria-label="Conversations">
  <div class="top">
    <button id="newc" type="button">Nouvelle conversation</button>
    <button id="closep" class="alt" type="button">Fermer</button>
  </div>
  <div class="tabs"><button class="alt tab on" data-tab="c" type="button">Conversations</button><button class="alt tab" data-tab="f" type="button">Favoris</button></div>
  <div class="srch"><input id="lq" type="search" placeholder="Chercher dans mes conversations"></div>
  <ul id="list"></ul>
  <div class="foot"><button id="exp" class="alt small" type="button">Sauvegarder</button><button id="impb" class="alt small" type="button">Restaurer</button><input id="imp" type="file" accept="application/json,.json" hidden></div>
</aside>

<header>
  <h1>Cherche</h1>
  <div class="hb"><button id="theme" class="alt small" type="button">Sombre</button><button id="openp" class="alt small" type="button">Conversations</button></div>
</header>
<p class="sub">Tape une question, l'appli cherche sur Wikipédia.</p>

<form id="f">
  <input id="q" type="search" placeholder="Par exemple : Nikola Tesla" autocomplete="off" enterkeyhint="search" required>
  <button id="mic" class="alt" type="button" aria-label="Dicter la question" hidden><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-3.1A7 7 0 0 0 19 11z"/></svg></button>
  <button id="go" type="submit">Chercher</button>
</form>
<div class="tools">
  <select id="src" aria-label="Source de la recherche"><option value="wikipedia">Wikipédia</option><option value="wiktionary">Wiktionnaire (définitions)</option></select>
  <button id="rand" class="alt small" type="button">Article au hasard</button>
</div>

<div id="thread" aria-live="polite"></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const store = {
  get(k){ try { return localStorage.getItem(k) || ''; } catch(e){ return ''; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
};

/* ---------- Conversations ---------- */
let convs = [];
try { convs = JSON.parse(store.get('convs') || '[]'); } catch(e){ convs = []; }
let cur = null;

const persist = () => store.set('convs', JSON.stringify(convs));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);

function newConv(){
  cur = { id: uid(), title: 'Nouvelle conversation', date: Date.now(), items: [] };
  convs.unshift(cur);
  persist(); renderThread(); renderList();
}
function openConv(id){
  const c = convs.find(x => x.id === id);
  if(!c) return;
  cur = c; renderThread(); renderList(); closePanel();
}
function delConv(id){
  const c = convs.find(x => x.id === id);
  if(!c || !confirm('Supprimer cette conversation ?')) return;
  convs = convs.filter(x => x.id !== id);
  persist();
  if(cur && cur.id === id){
    cur = convs[0] || null;
    if(!cur) { newConv(); return; }
  }
  renderThread(); renderList();
}

let tab = 'c';
function langLabel(r){
  const d = r.src === 'wiktionary', fr = r.lang === 'fr';
  return d ? (fr ? 'Wiktionnaire en français' : 'Wiktionnaire en anglais (rien en français)') : (fr ? 'Wikipédia en français' : 'Wikipédia en anglais (rien en français)');
}
function renderList(){
  const ul = $('list');
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  $('lq').hidden = tab !== 'c';
  if(tab === 'f'){
    ul.innerHTML = favs.length ? favs.map((f,i) => `<li><button class="pick" data-fav="${i}" type="button"><span>${esc(f.title)}</span><small>${esc(langLabel(f))}</small></button><button class="del" data-favdel="${i}" type="button">Retirer</button></li>`).join('') : `<li class="empty">Aucun favori pour l'instant.</li>`;
    return;
  }
  const k = $('lq').value.trim().toLowerCase();
  const list = k ? convs.filter(c => (c.title + ' ' + c.items.map(it => it.q + ' ' + (it.res ? it.res.title + ' ' + it.res.extract : '')).join(' ')).toLowerCase().includes(k)) : convs;
  if(!list.length){ ul.innerHTML = `<li class="empty">${k ? 'Aucun résultat.' : 'Aucune conversation.'}</li>`; return; }
  ul.innerHTML = list.map(c => {
    const d = new Date(c.date).toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
    return `<li class="${cur && cur.id===c.id ? 'cur':''}">
      <button class="pick" data-id="${c.id}" type="button"><span>${esc(c.title)}</span><small>${d} · ${c.items.length} recherche${c.items.length>1?'s':''}</small></button>
      <button class="ren" data-ren="${c.id}" type="button" aria-label="Renommer ${esc(c.title)}">Renommer</button>
      <button class="del" data-del="${c.id}" type="button" aria-label="Supprimer ${esc(c.title)}">Supprimer</button>
    </li>`;
  }).join('');
}
$('list').addEventListener('click', e => {
  const g = a => e.target.closest('[' + a + ']');
  let x;
  if((x = g('data-del'))) delConv(x.dataset.del);
  else if((x = g('data-ren'))) renConv(x.dataset.ren);
  else if((x = g('data-id'))) openConv(x.dataset.id);
  else if((x = g('data-favdel'))){ favs.splice(+x.dataset.favdel, 1); saveFavs(); renderList(); }
  else if((x = g('data-fav'))) openFav(+x.dataset.fav);
});

function openPanel(){ document.body.classList.add('open'); }
function closePanel(){ document.body.classList.remove('open'); }
$('openp').onclick = openPanel;
$('closep').onclick = closePanel;
$('scrim').onclick = closePanel;
$('newc').onclick = () => { newConv(); closePanel(); $('q').focus(); };

/* ---------- Affichage ---------- */
function cardHTML(it, idx){
  if(it.error) return `<div class="msg err">${esc(it.error)}</div>`;
  if(it.notfound) return '<div class="msg">Aucun résultat sur Wikipédia (français ni anglais). Essaie avec d\'autres mots.</div>';
  const r = it.res;
  return `<article class="card">
    ${r.img ? `<img src="${esc(r.img)}" alt="${esc(r.title)}">` : ''}
    <div class="body">
      <h2>${esc(r.title)}</h2>
      <p class="lang">${esc(langLabel(r))}</p>
      <p class="extract">${esc(r.extract)}</p>
      <div class="more" id="more-${idx}">${it.showMore ? esc(it.more) : ''}</div>
      <div class="actions">
        <button class="sumbtn" data-i="${idx}" type="button">Résumer</button>
        ${'speechSynthesis' in window ? `<button class="alt listenbtn" data-i="${idx}" type="button">Écouter</button>` : ''}
        ${r.src === 'wiktionary' ? '' : `<button class="alt morebtn" data-i="${idx}" type="button">${it.showMore ? 'Réduire' : 'Lire la suite'}</button>`}
        <button class="alt favbtn" data-i="${idx}" type="button">${isFav(r.url) ? 'Retirer des favoris' : 'Favori'}</button>
        <button class="alt sharebtn" data-i="${idx}" type="button">Partager</button>
        <a class="btn alt" href="${esc(r.url)}" target="_blank" rel="noopener">Lire l'article</a>
      </div>
      <div class="sumout" id="sum-${idx}" aria-live="polite">${it.summary ? sumHTML(it) : ''}</div>
      ${chipsHTML(r)}
    </div>
  </article>`;
}
function renderThread(){
  const t = $('thread');
  if(!cur){ t.innerHTML=''; return; }
  t.innerHTML = cur.items.map((it,i) => `<div class="q">${esc(it.q)}</div>${cardHTML(it,i)}`).join('');
}
$('thread').addEventListener('click', e => {
  const b = e.target.closest('button');
  if(!b) return;
  if(b.classList.contains('sumbtn')) summarize(+b.dataset.i, b);
  else if(b.classList.contains('listenbtn')) listen(+b.dataset.i, b);
  else if(b.classList.contains('sharebtn')) share(+b.dataset.i, b);
  else if(b.classList.contains('morebtn')) more(+b.dataset.i, b);
  else if(b.classList.contains('favbtn')) toggleFav(+b.dataset.i, b);
  else if(b.classList.contains('chip')){ $('q').value = b.dataset.t; doSearch(b.dataset.t); window.scrollTo({top:0,behavior:'smooth'}); }
});

/* ---------- Wikipédia ---------- */
function clean(q){
  const c = q.trim()
    .replace(/[?!.]+$/,'')
    .replace(/^(qui est|qui était|qui sont|qu['’]est[- ]ce que|qu['’]est[- ]ce qu['’]|c['’]est quoi|c['’]est qui|what is|who is)\s+/i,'')
    .replace(/^(un |une |le |la |les |l['’]|d['’]|du |de la |des )/i,'')
    .trim();
  return c || q.trim();
}
function wikiURL(lang, src, params){
  return `https://${lang}.${src}.org/w/api.php?action=query&${params}&format=json&origin=*`;
}
function toRes(pages, lang, src){
  pages = pages.slice().sort((a,b) => (a.index||0) - (b.index||0));
  const p = pages[0];
  if(!p || !p.extract) return null;
  return { lang, src, title:p.title, extract:p.extract.trim(), img:(p.thumbnail && p.thumbnail.source) || '', url:p.fullurl,
    others: pages.slice(1,5).map(o => ({ title:o.title, url:o.fullurl })) };
}
async function wiki(lang, q, src = 'wikipedia'){
  const dict = src === 'wiktionary';
  const u = wikiURL(lang, src, `generator=search&gsrsearch=${encodeURIComponent(q)}&gsrlimit=${dict ? 1 : 5}&prop=extracts|pageimages|info&explaintext=1&${dict ? 'exchars=1200' : 'exintro=1&exsentences=5'}&piprop=thumbnail&pithumbsize=700&inprop=url`);
  const r = await fetch(u);
  if(!r.ok) throw new Error('wiki');
  const j = await r.json();
  return toRes(j.query ? Object.values(j.query.pages) : [], lang, src);
}
async function randomWiki(){
  for(let k = 0; k < 3; k++){
    const u = wikiURL('fr', 'wikipedia', 'generator=random&grnnamespace=0&grnlimit=1&prop=extracts|pageimages|info&explaintext=1&exintro=1&exsentences=5&piprop=thumbnail&pithumbsize=700&inprop=url');
    const r = await fetch(u);
    if(!r.ok) throw new Error('wiki');
    const j = await r.json();
    const res = toRes(j.query ? Object.values(j.query.pages) : [], 'fr', 'wikipedia');
    if(res) return res;
  }
  return null;
}

$('f').addEventListener('submit', e => { e.preventDefault(); doSearch($('q').value.trim()); });

async function doSearch(raw){
  if(!raw) return;
  if(!cur) newConv();
  $('go').disabled = true;
  let item = { q: raw };
  try {
    const src = $('src').value;
    let res = await wiki('fr', clean(raw), src);
    if(!res) res = await wiki('en', clean(raw), src);
    if(res) item.res = res; else item.notfound = true;
  } catch(err){
    item.error = navigator.onLine ? 'Impossible de joindre Wikipédia. Réessaie dans un instant.' : 'Tu es hors ligne : la recherche est impossible, mais tu peux relire tes conversations.';
  }
  if(!cur.items.length) cur.title = raw.length > 40 ? raw.slice(0,40) + '…' : raw;
  cur.items.push(item);
  persist(); renderThread(); renderList();
  $('q').value = '';
  $('go').disabled = false;
  const cards = document.querySelectorAll('#thread .card, #thread .msg');
  const last = cards[cards.length-1];
  if(last) last.scrollIntoView({behavior:'smooth', block:'start'});
}

/* ---------- Résumé simple (sans IA, rien à télécharger) ---------- */
function sumHTML(it){
  return `<div class="sum"><b>Résumé</b>${esc(it.summary)}</div>`;
}
function firstSentences(t, n){
  const parts = t.replace(/\s+/g,' ').match(/[^.!?]+[.!?]+(\s|$)/g);
  return parts ? parts.slice(0,n).join('').trim() : t.slice(0,300);
}
function summarize(i, btn){
  const it = cur.items[i];
  it.summary = firstSentences(it.res.extract, 2);
  persist();
  $('sum-'+i).innerHTML = sumHTML(it);
}

/* ---------- Suggestions, lecture, partage, voix, hors ligne ---------- */
function chipsHTML(r){
  if(!r.others || !r.others.length) return '';
  return `<div class="chips"><p class="lang">D'autres articles proches :</p>${r.others.map(o => `<button class="chip" data-t="${esc(o.title)}" type="button">${esc(o.title)}</button>`).join('')}</div>`;
}
function listen(i, btn){
  const sy = window.speechSynthesis;
  if(!sy) return;
  if(sy.speaking){ sy.cancel(); document.querySelectorAll('.listenbtn').forEach(b => b.textContent = 'Écouter'); return; }
  const it = cur.items[i];
  const u = new SpeechSynthesisUtterance(it.summary || it.res.extract);
  u.lang = it.res.lang === 'fr' ? 'fr-FR' : 'en-US';
  u.onend = u.onerror = () => { btn.textContent = 'Écouter'; };
  btn.textContent = 'Arrêter';
  sy.speak(u);
}
async function share(i, btn){
  const r = cur.items[i].res, it = cur.items[i];
  const text = it.summary || firstSentences(r.extract, 2);
  try{
    if(navigator.share){ await navigator.share({ title:r.title, text, url:r.url }); return; }
    await navigator.clipboard.writeText(`${r.title}\n${text}\n${r.url}`);
    btn.textContent = 'Copié';
    setTimeout(() => btn.textContent = 'Partager', 1500);
  }catch(e){}
}
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if(SR){
  const mic = $('mic');
  mic.hidden = false;
  mic.onclick = () => {
    const rec = new SR();
    rec.lang = 'fr-FR'; rec.interimResults = false; rec.maxAlternatives = 1;
    mic.classList.add('rec');
    rec.onresult = e => { const t = e.results[0][0].transcript; $('q').value = t; doSearch(t); };
    rec.onend = rec.onerror = () => mic.classList.remove('rec');
    try{ rec.start(); }catch(e){ mic.classList.remove('rec'); }
  };
}
if('serviceWorker' in navigator){ navigator.serviceWorker.register('./sw.js').catch(() => {}); }

/* ---------- Favoris, suite, hasard, renommer, thème, sauvegarde ---------- */
let favs = [];
try { favs = JSON.parse(store.get('favs') || '[]'); } catch(e){ favs = []; }
const saveFavs = () => store.set('favs', JSON.stringify(favs));
const isFav = u => favs.some(f => f.url === u);
function toggleFav(i, btn){
  const r = cur.items[i].res;
  if(isFav(r.url)) favs = favs.filter(f => f.url !== r.url);
  else favs.unshift({ title:r.title, url:r.url, lang:r.lang, src:r.src || 'wikipedia', extract:r.extract, img:r.img || '', others:[] });
  saveFavs();
  btn.textContent = isFav(r.url) ? 'Retirer des favoris' : 'Favori';
  if(tab === 'f') renderList();
}
function openFav(i){
  const f = favs[i];
  if(!f) return;
  if(!cur) newConv();
  if(!cur.items.length) cur.title = f.title;
  cur.items.push({ q:f.title, res:Object.assign({}, f) });
  persist(); renderThread(); renderList(); closePanel(); scrollLast();
}
function scrollLast(){
  const c = document.querySelectorAll('#thread .card, #thread .msg');
  const l = c[c.length-1];
  if(l) l.scrollIntoView({behavior:'smooth', block:'start'});
}
async function more(i, btn){
  const it = cur.items[i], r = it.res, box = $('more-'+i);
  if(it.showMore){ it.showMore = false; }
  else{
    if(!it.more){
      btn.disabled = true; btn.textContent = 'Chargement…';
      try{
        const u = `https://${r.lang}.wikipedia.org/w/api.php?action=query&prop=extracts&explaintext=1&exchars=6000&redirects=1&titles=${encodeURIComponent(r.title)}&format=json&origin=*`;
        const j = await (await fetch(u)).json();
        it.more = (Object.values(j.query.pages)[0].extract || '').trim();
      }catch(e){
        btn.disabled = false; btn.textContent = 'Lire la suite';
        box.textContent = 'Impossible de charger la suite (hors ligne ?).';
        return;
      }
      btn.disabled = false;
    }
    it.showMore = true;
  }
  persist();
  box.textContent = it.showMore ? it.more : '';
  btn.textContent = it.showMore ? 'Réduire' : 'Lire la suite';
}
$('rand').onclick = doRandom;
async function doRandom(){
  if(!cur) newConv();
  $('rand').disabled = true;
  const item = { q: 'Article au hasard' };
  try{
    const res = await randomWiki();
    if(res) item.res = res; else item.notfound = true;
  }catch(err){
    item.error = navigator.onLine ? 'Impossible de joindre Wikipédia. Réessaie dans un instant.' : 'Tu es hors ligne : la recherche est impossible, mais tu peux relire tes conversations.';
  }
  if(!cur.items.length) cur.title = 'Article au hasard';
  cur.items.push(item);
  persist(); renderThread(); renderList();
  $('rand').disabled = false;
  scrollLast();
}
function renConv(id){
  const c = convs.find(x => x.id === id);
  if(!c) return;
  const t = prompt('Nouveau nom de la conversation :', c.title);
  if(t && t.trim()){ c.title = t.trim().slice(0,60); persist(); renderList(); }
}
document.querySelectorAll('.tab').forEach(b => b.onclick = () => { tab = b.dataset.tab; renderList(); });
$('lq').addEventListener('input', renderList);

function applyTheme(t){
  document.documentElement.dataset.theme = t;
  $('theme').textContent = t === 'dark' ? 'Clair' : 'Sombre';
  const m = document.querySelector('meta[name=theme-color]');
  if(m) m.content = t === 'dark' ? '#0f1a20' : '#f2f6f8';
}
applyTheme(store.get('theme') || (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
$('theme').onclick = () => {
  const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  store.set('theme', t); applyTheme(t);
};

$('exp').onclick = () => {
  const blob = new Blob([JSON.stringify({ convs, favs }, null, 1)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'cherche-sauvegarde-' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
};
$('impb').onclick = () => $('imp').click();
$('imp').onchange = async e => {
  const f = e.target.files[0];
  if(!f) return;
  try{
    const d = JSON.parse(await f.text());
    (d.convs || []).forEach(c => { if(c && c.id && Array.isArray(c.items) && !convs.some(x => x.id === c.id)) convs.push(c); });
    (d.favs || []).forEach(v => { if(v && v.url && !isFav(v.url)) favs.push(v); });
    convs.sort((a,b) => b.date - a.date);
    persist(); saveFavs(); renderList();
    alert('Sauvegarde restaurée.');
  }catch(err){ alert("Ce fichier n'est pas une sauvegarde valide."); }
  e.target.value = '';
};

/* ---------- Démarrage : nouvelle conversation à chaque ouverture ---------- */
newConv();
</script>
